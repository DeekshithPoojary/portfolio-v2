  <body>

    <!--
      Netlify Forms detects forms at BUILD time by parsing the static HTML.
      React renders the real form on the client, so this hidden twin exists
      purely so Netlify registers the "contact" form and its fields.
      Do not delete it — submissions will 404 without it.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
  </body>
